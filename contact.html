<!doctype html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="d-flex flex-column h-100 bg-white">
<main class="flex-shrink-0">

    <!-- Navigation Start -->
    <nav class="navbar navbar-expand-lg shadow bg-white sticky-top py-3">
        <div class="container px-5">
            <span class="text-danger fs-5" data-bs-target="#navbarNav"><i class="bi bi-code-slash"></i></span>
            <a class="navbar-brand mb-2 mb-lg-0 ms-sm-0" href="index.html"><span class="fw-bolder text-info mx-2">Faysal Imran</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                <!-- <span class="fs-2 text-info"><i class="bi bi-code-slash"></i></span> -->
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bold">
                    <li class="nav-item"><a class="nav-link text-info" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container px-5 py-5">
        <div class="bg-light py-5 justify-content-center rounded-4">

            <div class="text-center mb-5">
                <div class="features bg-primary-to-secondary text-white fs-4 mx-auto my-3">
                    <i class="bi bi-envelope"></i>
                </div>
                <h1 class="fw-bolder">Get in touch</h1>
                <p class="text-muted fs-5"> Let's work together!</p>
            </div>

            <div class="row align-items-center justify-content-center">
                <div class="col-lg-6 col-8">
                    <!-- Form Section Start -->
                    <form class="ContactForm">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="name" placeholder="Enter Your Name...">
                            <label for="name" class="form-label">Full name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" placeholder="someone@example.com">
                            <label for="email" class="form-label">Email address</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" id="phone" placeholder="(880) 12 5485 6923">
                            <label for="phone" class="form-label">Phone number</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea class="form-control" placeholder="Leave a comment here" id="message" style="height: 10rem"></textarea>
                            <label for="message" class="form-label">Message</label>
                        </div>
                        <div class="d-grid">
                            <button class="btn btn-lg btn-dark" id="submitButton" type="submit">Submit</button>
                        </div>
                    </form>
                    <!-- Form Section End -->
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer Section Start -->
<footer class="bg-white py-4">
    <div class="container px-5">
